<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">...</div>

        <div class="nav-links">
            <a href="#">About</a>
            <a href="#">Watch now</a>
            <a href="#">Actors</a>
            <a href="#">Contact</a>
        </div>

        <div class="menu">☰</div>
    </nav>

    <section class="hero">

        <div class="hero-content">

            <div class="hero-text">
                <img src="./main squid.png" alt="">

                <p>
                    Action / Thriller / Drama Series
                    directed by Dong-hyuk Hwang
                </p>

                <p>Season 1: 9 Episodes</p>

                <div class="buttons">
                    <button class="play-btn1">
                        <i class="ri-play-circle-fill"></i>
                        <span>Play Now</span>
                    </button>

                    <button class="trailer-btn">
                        <i class="ri-play-line"></i>
                        <span>Watch Trailer</span>
                    </button>
                </div>
            </div>

            <div class="hero-image">
                <img src="./main guard.png" alt="">
            </div>

        </div>

    </section>

    <div class="cards">

        <div class="card">
            <img src="./card1.jpg" alt="">
            <button class="play-btn">
                <i class="ri-play-fill"></i>
            </button>
        </div>

        <div class="card">
            <img src="https://media.gq.com/photos/6156348b61e30210db4d35d4/16:9/w_1920,c_limit/SquidGame_Unit_108_0070.jpg"
                alt="">
            <button class="play-btn">
                <i class="ri-play-fill"></i>
            </button>
        </div>

        <div class="card">
            <img src="https://img-cdn.publive.online/fit-in/1280x720/filters:format(webp)/elle-india/media/post_attachments/wp-content/uploads/2024/12/BANNER-IMG-37.png"
                alt="">
            <button class="play-btn">
                <i class="ri-play-fill"></i>
            </button>
        </div>

    </div>
</body>

</html>
